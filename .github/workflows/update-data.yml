name: Update course data

on:
  push:
    branches: [main]
  # Started every 2 hours by "Schedule data refresh" (schedule-refresh.yml), or by hand
  workflow_dispatch:
    inputs:
      terms:
        description: 'Term codes to scrape, comma separated (blank = every term open for registration)'
        required: false
        default: ''
      refresh_catalog:
        description: 'Re-download every course description'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run tests
        run: npm test

      - name: Restore last good data
        uses: actions/cache/restore@v4
        with:
          path: |
            data/terms
            data/terms.json
            data/catalog
            data/rmp.json
          key: course-data-${{ github.run_id }}
          restore-keys: course-data-

      - name: Scrape Banner class search
        id: banner
        continue-on-error: true
        run: node scripts/scrape-banner.mjs
        env:
          TERMS: ${{ inputs.terms }}
          CATALOG_MAX_AGE_DAYS: ${{ inputs.refresh_catalog && '0' || '30' }}

      - name: Scrape Rate My Professors
        id: rmp
        continue-on-error: true
        run: node scripts/scrape-rmp.mjs

      - name: Report problems
        if: steps.banner.outcome != 'success' || steps.rmp.outcome != 'success'
        run: |
          if [ "${{ steps.banner.outcome }}" != "success" ]; then
            echo "::warning title=Banner scrape failed::Publishing the last good course data instead. Check the 'Scrape Banner class search' step log."
          fi
          if [ "${{ steps.rmp.outcome }}" != "success" ]; then
            echo "::warning title=RMP scrape failed::Publishing the last good ratings instead."
          fi

      - name: Save data for the next run
        if: steps.banner.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            data/terms
            data/terms.json
            data/catalog
            data/rmp.json
          key: course-data-${{ github.run_id }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4